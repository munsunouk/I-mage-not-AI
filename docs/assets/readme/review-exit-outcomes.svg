<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Review exit codes 0 through 4">
  <rect width="640" height="220" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#1a202c">review exit codes (architecture contract)</text>
  <g font-family="system-ui,sans-serif" font-size="12">
    <rect x="24" y="48" width="112" height="56" rx="6" fill="#c6f6d5" stroke="#276749"/>
    <text x="80" y="72" text-anchor="middle" font-weight="600">0</text>
    <text x="80" y="90" text-anchor="middle">PASS / complete</text>
    <rect x="152" y="48" width="112" height="56" rx="6" fill="#fed7d7" stroke="#c53030"/>
    <text x="208" y="72" text-anchor="middle" font-weight="600">1</text>
    <text x="208" y="90" text-anchor="middle">FAIL</text>
    <rect x="280" y="48" width="112" height="56" rx="6" fill="#feebc8" stroke="#c05621"/>
    <text x="336" y="72" text-anchor="middle" font-weight="600">2</text>
    <text x="336" y="90" text-anchor="middle">INCOMPLETE</text>
    <rect x="408" y="48" width="112" height="56" rx="6" fill="#e2e8f0" stroke="#718096"/>
    <text x="464" y="72" text-anchor="middle" font-weight="600">3</text>
    <text x="464" y="90" text-anchor="middle">invalid input</text>
    <rect x="536" y="48" width="80" height="56" rx="6" fill="#e2e8f0" stroke="#718096"/>
    <text x="576" y="72" text-anchor="middle" font-weight="600">4</text>
    <text x="576" y="90" text-anchor="middle">internal</text>
  </g>
  <text x="320" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4a5568">Missing measurements or unresolved checks cannot become PASS</text>
  <rect x="80" y="160" width="480" height="44" rx="6" fill="#fff" stroke="#cbd5e0"/>
  <text x="320" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#2d3748">coverage --report | explain review.json | verify --before/--after</text>
</svg>
