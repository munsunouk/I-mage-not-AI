schema_version: 1
packs:
  icon:
    description: Flat and SVG icon constraints
    algorithms: [exact_palette_count, masked_palette_count, ciede2000_uniformity, alpha_centroid_offset, alpha_margin_ratio, svg_gradient_declarations, svg_stroke_width_range, svg_path_geometry]
  character:
    description: Feature-masked character constraints
    algorithms: [ciede2000_uniformity, masked_palette_count, masked_luma_levels, mask_connected_components, mask_hole_count, mask_skeleton_endpoints, mask_skeleton_branches, mask_minimum_width, mask_boundary_distance, mask_iou_dice, mask_dice, mask_hu_shape_distance, roi_tenengrad_sharpness, mask_boundary_gradient, silhouette_metrics, mask_reflection_iou, mask_intersection_ratio]
  character_anatomy:
    description: OpenPose BODY_25 anatomy measurements requiring reviewed detections and explicit limits
    algorithms: [openpose_bone_ratio, openpose_joint_angle]
  character_similarity:
    description: Reference-image similarity diagnostics using optional local learned models
    algorithms: [lpips_similarity, dinov2_cosine_similarity]
  background:
    description: Minimal, patterned, and tileable background measurements
    algorithms: [region_occupancy, fft_periodic_energy_ratio, tile_edge_color_error, linear_gradient_fit_diagnostic, masked_color_uniformity]
  game:
    description: Deterministic checks over engine-exported motion, pose, contact, event, and particle traces
    algorithms: [position_difference, velocity_magnitude, acceleration_magnitude, jerk_magnitude, rotation_distance, loop_boundary_difference, pose_boundary_distance, event_timing_difference, particle_lifetime, bone_length_deviation, foot_sliding_distance, anchor_distance, particle_emitter_bounds, alpha_weighted_occlusion]
  sprite:
    description: Sprite atlas frame extraction, layer alpha, and deterministic strip checks
    algorithms: [alpha_weighted_occlusion, sprite_baseline_y_variance, sprite_bbox_height_variance, sprite_inter_frame_palette_subset, sprite_inter_frame_changed_pixel_ratio, sprite_reference_frame_changed_pixel_ratio]
  sprite_sheet:
    description: Raster sprite sheet / atlas policies (CLI sprite-sheet check)
    algorithms: [sprite_baseline_y_variance, sprite_bbox_height_variance, sprite_inter_frame_palette_subset, sprite_inter_frame_changed_pixel_ratio, sprite_reference_frame_changed_pixel_ratio, sprite_loop_changed_pixel_ratio, sprite_foot_metrics, sprite_cell_empty_forbidden, sprite_cell_duplicate_forbidden, sprite_cell_min_inner_border, sprite_cell_near_empty, sprite_margin_gap_contamination, sprite_sheet_file_limits, sprite_sheet_bbox_height_spread, sprite_sheet_ppu_spread]
  project_assets:
    description: Required asset path and glob completeness (project check-assets / preview --asset-policy)
    algorithms: [project_required_paths, project_required_globs]
  advisory:
    description: Non-gating AI-generation likelihood (optional external detector backends)
    algorithms: [advisory_ai_generated_likelihood]
  lighting:
    description: Declared light direction and chromatic shading plane checks
    algorithms: [lighting_luma_plane_fit, lighting_declared_direction_alignment, lighting_chromatic_shading_direction_cosine, lighting_cross_frame_direction_variance]
  motion:
    description: Position, velocity, acceleration, jerk, rotation, and loop continuity
    algorithms: [position_difference, velocity_magnitude, acceleration_magnitude, jerk_magnitude, rotation_distance, loop_boundary_difference]
  skeletal_animation:
    description: Pose boundary, bone-length, and foot-contact checks
    algorithms: [pose_boundary_distance, bone_length_deviation, foot_sliding_distance]
  vfx:
    description: Anchor alignment, particle lifetime, bounds, and occlusion
    algorithms: [anchor_distance, particle_lifetime, particle_emitter_bounds, alpha_weighted_occlusion]
  runtime:
    description: Exported event timing checks
    algorithms: [event_timing_difference]
  game_runtime:
    description: Observed engine runtime callback and particle checks (game runtime-check reports)
    algorithms: [runtime_callback_count, runtime_callback_timing, runtime_particle_state, runtime_particle_bounds, runtime_particle_alive_count]
  game_render:
    description: Engine-rendered frame capture checks (game render-check reports)
    algorithms: [render_capture_count, render_changed_pixel_ratio, render_event_frame_alignment, render_flash_metrics, render_roi_oracle, render_trace_motion_bound]
