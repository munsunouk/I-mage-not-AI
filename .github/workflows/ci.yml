name: tests
on: [push, pull_request]
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
    # GitHub-hosted runners only. Do not switch this matrix to self-hosted labels.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check i_mage_not_ai tests benchmarks
      - run: mypy i_mage_not_ai tests benchmarks
      - run: python -m pytest -q
