[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imreview"
version = "0.1.0"
description = "Deterministic, feature-aware image design constraint linter"
requires-python = ">=3.11"
dependencies = ["Pillow>=10.0,<13", "numpy>=1.24,<3", "svgpathtools>=1.6,<2", "PyYAML>=6,<7", "pydantic>=2.7,<3", "typer>=0.12,<1"]

[project.scripts]
imreview = "imreview.typer_cli:app"

[tool.setuptools]
packages = ["imreview"]

[tool.setuptools.package-data]
imreview = ["rules/*.yaml"]
